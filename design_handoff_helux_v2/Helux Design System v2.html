<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helux — Design system v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="v2/helux-v2.css">
<style>
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;line-height:1.5}
.d-wrap{max-width:1240px;margin:0 auto;padding:56px 32px 120px}
.d-top{padding-bottom:40px;border-bottom:1px solid var(--hairline)}
.d-h1{font-size:56px;line-height:60px;font-weight:700;letter-spacing:-.035em;margin:28px 0 12px}
.d-lead{font-size:18px;line-height:28px;color:var(--text-dim);max-width:720px;margin:0;text-wrap:pretty}
.d-toc{display:flex;gap:4px;flex-wrap:wrap;margin-top:28px}
.d-toc a{min-height:40px;display:inline-flex;align-items:center;padding:0 14px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--hairline-2);color:var(--text-dim);text-decoration:none;font-size:14px;font-weight:500}
.d-toc a:hover{color:var(--text);background:var(--surface-1)}
.d-sec{padding-top:72px;scroll-margin-top:16px}
.d-sec-n{color:var(--text-faint);margin-bottom:8px}
.d-h2{font-size:40px;line-height:44px;font-weight:700;letter-spacing:-.03em;margin:0 0 12px}
.d-sub{margin-top:44px}
.d-h3{font-size:18px;line-height:24px;font-weight:600;letter-spacing:-.01em;margin:0 0 6px}
.d-note{font-size:14px;line-height:21px;color:var(--text-dim);max-width:760px;margin:6px 0 16px;text-wrap:pretty}
.d-sub>.d-h3+*{margin-top:16px}
.d-list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:10px;max-width:820px;color:var(--text-dim);font-size:15px;line-height:23px}.d-list b{color:var(--text);font-weight:600}
.d-pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.d-pal-i{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:start}.d-pal-i i{height:56px;border-radius:12px}
.d-sig{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:40px;align-items:center;padding:32px;border-radius:24px;background:var(--surface-1);box-shadow:inset 0 0 0 1px var(--hairline)}
.d-ascii{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px}
.d-ascii pre{margin:0;font-family:var(--mono);font-size:12px;line-height:17px;color:var(--text-dim);background:var(--surface-1);border-radius:16px;padding:20px;overflow:auto;box-shadow:inset 0 0 0 1px var(--hairline)}
.d-princ{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:24px;counter-reset:p}
.d-princ li{counter-increment:p;color:var(--text-dim);font-size:15px;line-height:23px}
.d-princ li::before{content:counter(p);display:block;font-family:var(--mono);font-size:13px;color:var(--text-faint);margin-bottom:8px}
.d-princ b{display:block;color:var(--text);font-size:18px;font-weight:600;margin-bottom:4px;letter-spacing:-.01em}
.d-swap{display:flex;flex-direction:column}
.d-swap>div{display:grid;grid-template-columns:minmax(0,1fr) 24px minmax(0,1.4fr);gap:16px;padding:14px 0;border-top:1px solid var(--hairline);font-size:15px;line-height:22px}
.d-was{color:var(--text-dim);text-decoration:line-through;text-decoration-color:var(--text-faint)}
.d-sws{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px 20px}
.d-sw{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center}.d-sw i{height:44px;border-radius:10px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.d-sem{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.d-sem>div{padding:20px;border-radius:16px;background:var(--surface-1);box-shadow:inset 0 0 0 1px var(--hairline)}
.d-sem h4{margin:0 0 14px;font-size:15px;font-weight:600}
.d-sem-r{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:36px}
.d-ct{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.d-ct-i{display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--hairline)}
.d-type{display:flex;flex-direction:column}
.d-type-r{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;align-items:center;padding:16px 0;border-top:1px solid var(--hairline)}
.d-space{display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap}.d-space>div{display:flex;flex-direction:column;gap:6px;align-items:flex-start}.d-space i{background:var(--text-dim);border-radius:2px;display:block}
.d-radii{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px}.d-radii i{display:block;width:72px;height:56px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--hairline-3);margin-bottom:10px}
.d-elev{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;padding:24px;background:var(--bg);border-radius:16px}
.d-elev>div{padding:20px;min-height:130px}.d-elev>div:first-child{border-radius:16px}.d-elev b{font-weight:600}
.d-motion{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}.d-motion>div{display:flex;flex-direction:column;gap:2px;padding:16px;border-radius:16px;background:var(--surface-1);box-shadow:inset 0 0 0 1px var(--hairline)}
.d-icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}.d-icons>div{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 4px;border-radius:12px;background:var(--surface-1)}
.d-spec{margin-top:24px;padding:28px;border-radius:24px;background:var(--surface-1);box-shadow:inset 0 0 0 1px var(--hairline)}
.d-spec-h{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:24px;margin-bottom:24px}
.d-spec-r{display:flex;flex-direction:column;gap:6px}.d-spec-r p{margin:0;font-size:14px;line-height:21px;color:var(--text-dim);text-wrap:pretty}.d-spec-r b{color:var(--text);font-weight:600;margin-right:4px}
.d-spec-demo{display:flex;flex-wrap:wrap;gap:24px 28px;align-items:flex-start;padding:24px;border-radius:16px;background:var(--bg)}
.d-st{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.d-st-b{min-height:44px;display:flex;align-items:center}
.d-focus-last .hx-step button:last-child{box-shadow:var(--focus)}
.d-mini{position:relative;width:320px;height:340px;border-radius:24px;overflow:hidden;background:var(--bg);box-shadow:inset 0 0 0 1px var(--hairline)}
.d-phones{display:grid;grid-template-columns:repeat(auto-fill,minmax(391px,1fr));gap:56px 24px;margin-top:32px;justify-items:center}
.d-phones figure{margin:0;display:flex;flex-direction:column;gap:18px;align-items:center}
.d-phones figcaption{font-size:14px;color:var(--text-dim);font-weight:500}
.d-desk{width:100%;max-width:1280px;aspect-ratio:1280/820;overflow:hidden;border-radius:12px}
.d-rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:0 32px}
.d-rule{padding:16px 0;border-top:1px solid var(--hairline)}.d-rule b{font-weight:600;font-size:15px}.d-rule p{margin:6px 0 0;font-size:14px;line-height:21px;color:var(--text-dim)}
.d-k{display:inline-block;min-width:68px;color:var(--text);font-weight:500}
.d-ba{display:flex;flex-direction:column}
.d-ba>div{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.3fr);gap:24px;padding:16px 0;border-top:1px solid var(--hairline);font-size:15px;line-height:22px}
@media(max-width:760px){.d-wrap{padding:32px 16px 80px}.d-h1{font-size:40px;line-height:44px}.d-sig,.d-spec-h,.d-type-r,.d-ba>div{grid-template-columns:1fr;gap:10px}.d-swap>div{grid-template-columns:1fr;gap:4px}.d-swap>div>span:nth-child(2){display:none}.d-phones{grid-template-columns:1fr}.d-ascii{grid-template-columns:1fr}.d-rules{grid-template-columns:1fr}.d-spec{padding:16px}.d-spec-demo{padding:16px}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="v2/v2-core.jsx"></script>
<script type="text/babel" src="v2/v2-screens.jsx"></script>
<script type="text/babel" src="v2/v2-doc-a.jsx"></script>
<script type="text/babel" src="v2/v2-doc-b.jsx"></script>
</body>
</html>
